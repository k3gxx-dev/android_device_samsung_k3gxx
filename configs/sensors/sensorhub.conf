# Galaxy S5 k3gxx sensor hardware.
# The STM32F401 SensorHub exposes the accelerometer, gyroscope and compass.
SENSOR_HUB_DEVICE=/dev/ssp_sensorhub
SENSOR_HUB_MCU=STM32F401CEY6B
# MAX86900 optical heart-rate monitor is wired through the SensorHub.
HEART_RATE_SENSOR=MAX86900
HEART_RATE_SENSOR_VENDOR=MAXIM
